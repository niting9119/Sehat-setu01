<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sehat Setu</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <style>
    body {
      background: var(--bg-app);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .minimal-auth-card {
      max-width: 450px;
      width: 100%;
      margin: 2.5rem auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }

    .role-select-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .role-btn {
      padding: 0.5rem 0.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-subtle);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .role-btn:hover {
      border-color: var(--border-medium);
      color: var(--text-main);
    }

    .role-btn.active-citizen {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
    }

    .role-btn.active-doctor {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .role-btn.active-asha {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--accent-purple);
      color: var(--accent-purple);
    }

    .role-btn.active-admin {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn-google {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-xs);
    }

    .btn-google:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .auth-tab-row {
      display: flex;
      background: var(--bg-surface-subtle);
      border-radius: var(--radius-md);
      padding: 0.25rem;
      margin-bottom: 1.15rem;
      border: 1px solid var(--border-subtle);
    }

    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 0.45rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .auth-tab-btn.active {
      background: var(--bg-surface);
      color: var(--primary-700);
      box-shadow: var(--shadow-xs);
    }

    [data-theme="dark"] .auth-tab-btn.active {
      color: var(--primary-300);
    }

    .otp-input-group {
      display: flex;
      gap: 0.4rem;
      justify-content: space-between;
      margin: 0.65rem 0;
    }

    .otp-box {
      width: 44px;
      height: 48px;
      text-align: center;
      font-size: 1.3rem;
      font-family: var(--font-mono);
      font-weight: 800;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-medium);
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .otp-box:focus {
      outline: none;
      border-color: var(--primary-600);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
    }

    .divider-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .divider-row::before,
    .divider-row::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .dev-login-box {
      background: var(--bg-surface-subtle);
      border: 1px dashed var(--border-medium);
      border-radius: var(--radius-md);
      padding: 0.65rem 0.85rem;
      margin-bottom: 1rem;
    }

    .dev-login-title {
      font-size: 0.725rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dev-fast-row {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
    }

    .dev-fast-chip {
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-full);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .dev-fast-chip:hover {
      background: var(--primary-50);
      color: var(--primary-700);
      border-color: var(--primary-400);
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="app-header" style="top: 0;">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path
              d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </div>
        <div>
          <span>Sehat Setu</span>
          <span class="brand-subtitle">Health Monitoring</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="signup.html" class="btn btn-sm btn-outline">Sign Up</a>
        <button class="icon-btn" title="Toggle Theme" onclick="window.SehatState.toggleTheme()">🌓</button>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div class="minimal-auth-card">
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <h2 style="font-size: 1.55rem; margin-bottom: 0.25rem;">Welcome Back</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Sign in to your health portal</p>
      </div>

      <!-- Quick Role Selection -->
      <div class="role-select-bar">
        <button type="button" class="role-btn active-citizen" data-role="citizen" onclick="setRole('citizen')">
          <span>👤</span>
          <span>Citizen</span>
        </button>
        <button type="button" class="role-btn" data-role="doctor" onclick="setRole('doctor')">
          <span>🩺</span>
          <span>Doctor</span>
        </button>
        <button type="button" class="role-btn" data-role="asha" onclick="setRole('asha')">
          <span>👩‍⚕️</span>
          <span>ASHA</span>
        </button>
        <button type="button" class="role-btn" data-role="admin" onclick="setRole('admin')">
          <span>🏛️</span>
          <span>Admin</span>
        </button>
      </div>

      <!-- Google Sign-In Button -->
      <button type="button" class="btn-google" onclick="loginWithGoogleOAuth()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" />
          <path fill="#34A853"
            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" />
          <path fill="#FBBC05"
            d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.04 0 12s.45 3.82 1.25 5.42l4.03-3.15z" />
          <path fill="#EA4335"
            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
        </svg>
        <span id="google-btn-text">Continue with Google (Gmail)</span>
      </button>

      <div class="divider-row">or choose login method</div>

      <!-- Segmented Tabs: Password vs OTP -->
      <div class="auth-tab-row">
        <button type="button" class="auth-tab-btn active" id="tab-pass" onclick="switchLoginMethod('password')">
          🔑 Password Login
        </button>
        <button type="button" class="auth-tab-btn" id="tab-otp" onclick="switchLoginMethod('otp')">
          📱 OTP Login
        </button>
      </div>

      <!-- Developer Quick Login Box -->
      <div class="dev-login-box">
        <div class="dev-login-title">
          <span>🛠️ Developer Quick Login:</span>
        </div>
        <div class="dev-fast-row">
          <span class="dev-fast-chip" onclick="devQuickLogin('rahul.sharma@example.com', 'citizen')">👤 Rahul
            (Citizen)</span>
          <span class="dev-fast-chip" onclick="devQuickLogin('dr.arishta@health.gov.in', 'doctor')">🩺 Dr.
            Arishta</span>
          <span class="dev-fast-chip" onclick="devQuickLogin('sunita.asha@health.gov.in', 'asha')">👩‍⚕️ Sunita
            (ASHA)</span>
          <span class="dev-fast-chip" onclick="devQuickLogin('director.idsp@nic.in', 'admin')">🏛️ Admin</span>
        </div>
      </div>

      <!-- METHOD 1: Password Form -->
      <form id="password-login-form">
        <input type="hidden" id="login-role" value="citizen">

        <div class="form-group">
          <label class="form-label" id="id-label" for="login-id">Registered Email Address / ID *</label>
          <input type="text" id="login-id" class="form-control" placeholder="e.g. rahul.sharma@example.com"
            value="rahul.sharma@example.com" required>
        </div>

        <div class="form-group">
          <div class="form-label">
            <span><label for="login-pass">Password *</label></span>
            <button type="button" onclick="togglePassword()" style="font-size: 0.75rem;">Show/Hide</button>
          </div>
          <input type="password" id="login-pass" class="form-control" value="password123" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; margin-top: 0.85rem;"
          id="submit-btn">
          Sign In with Password →
        </button>
      </form>

      <!-- METHOD 2: OTP Form -->
      <form id="otp-login-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="otp-mobile-input">Registered Email / Mobile *</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="otp-mobile-input" class="form-control" placeholder="e.g. rahul.sharma@example.com"
              value="rahul.sharma@example.com" required>
            <button type="button" class="btn btn-secondary" style="white-space: nowrap; font-size: 0.8rem;"
              onclick="triggerOTP()">Send OTP</button>
          </div>
        </div>

        <div id="otp-section" style="display: none; margin-top: 0.75rem;">
          <label class="form-label" for="otp-1">
            <span>Enter 6-Digit OTP *</span>
            <span style="font-size: 0.75rem; color: var(--accent-emerald);">Code sent (741920)</span>
          </label>
          <div class="otp-input-group">
            <input id="otp-1" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-box" value="7"
              required>
            <input id="otp-2" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-box" value="4"
              required>
            <input id="otp-3" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-box" value="1"
              required>
            <input id="otp-4" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-box" value="9"
              required>
            <input id="otp-5" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-box" value="2"
              required>
            <input id="otp-6" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-box" value="0"
              required>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; margin-top: 0.65rem;">
            Verify OTP & Sign In →
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="signup.html" style="font-weight: 700; color: var(--primary-600);">Sign Up</a>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let activeRole = 'citizen';

    function setRole(role) {
      activeRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.remove('active-citizen', 'active-doctor', 'active-asha', 'active-admin');
        if (btn.getAttribute('data-role') === role) {
          btn.classList.add(`active-${role}`);
        }
      });

      const idLabel = document.getElementById('id-label');
      const idInput = document.getElementById('login-id');
      const hiddenRole = document.getElementById('login-role');
      const googleBtnText = document.getElementById('google-btn-text');
      hiddenRole.value = role;

      googleBtnText.textContent = `Continue with Google as ${role.toUpperCase()}`;

      if (role === 'citizen') {
        idLabel.textContent = 'Registered Email Address / ID *';
        idInput.placeholder = 'e.g. rahul.sharma@example.com or C10291';
        idInput.value = 'rahul.sharma@example.com';
      } else if (role === 'doctor') {
        idLabel.textContent = 'Doctor Email / Reg. Number *';
        idInput.placeholder = 'e.g. dr.arishta@health.gov.in or DR-1004';
        idInput.value = 'dr.arishta@health.gov.in';
      } else if (role === 'asha') {
        idLabel.textContent = 'ASHA Email / Badge ID *';
        idInput.placeholder = 'e.g. sunita.asha@health.gov.in or ASHA-204';
        idInput.value = 'sunita.asha@health.gov.in';
      } else if (role === 'admin') {
        idLabel.textContent = 'Official Gov Email / Admin ID *';
        idInput.placeholder = 'e.g. director.idsp@nic.in or ADMIN-001';
        idInput.value = 'director.idsp@nic.in';
      }
    }

    function switchLoginMethod(method) {
      const tabPass = document.getElementById('tab-pass');
      const tabOtp = document.getElementById('tab-otp');
      const passForm = document.getElementById('password-login-form');
      const otpForm = document.getElementById('otp-login-form');

      if (method === 'password') {
        tabPass.classList.add('active');
        tabOtp.classList.remove('active');
        passForm.style.display = 'block';
        otpForm.style.display = 'none';
      } else {
        tabOtp.classList.add('active');
        tabPass.classList.remove('active');
        otpForm.style.display = 'block';
        passForm.style.display = 'none';
        triggerOTP();
      }
    }

    function triggerOTP() {
      const identifier = document.getElementById('otp-mobile-input').value.trim();
      fetch('/api/auth/otp/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier }) })
        .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.error); return data; })
        .then(() => {
          document.getElementById('otp-section').style.display = 'block';
          window.SehatUI.showToast('OTP Dispatched', 'Simulated 6-digit OTP code: 741920', 'success');
        })
        .catch(error => window.SehatUI.showToast('Account Not Found', error.message, 'warning'));
    }

    function loginWithGoogleOAuth() {
      window.location.href = `/auth/google?mode=login&role=${encodeURIComponent(activeRole)}`;
    }

    function devQuickLogin(identifier, role) {
      setRole(role);
      document.getElementById('login-id').value = identifier;
      document.getElementById('login-pass').value = 'password123';
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email: identifier, password: 'password123' })
      })
        .then(async response => {
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Login failed');
          return data;
        })
        .then(session => {
          window.SehatState.hydrateGoogleSession(session);
          window.SehatUI.showToast('Developer Login', `Authenticated as ${session.role.toUpperCase()} (${identifier}).`, 'success');
          setTimeout(() => {
            window.location.href = `index.html#/${session.role}/dashboard`;
          }, 350);
        })
        .catch(error => {
          window.SehatState.login(identifier, 'password123', role);
          window.SehatUI.showToast('Developer Login', `Authenticated in local mode as ${role.toUpperCase()}.`, 'info');
          setTimeout(() => {
            window.location.href = `index.html#/${role}/dashboard`;
          }, 350);
        });
    }

    function togglePassword() {
      const pass = document.getElementById('login-pass');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('password-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('login-id').value;
      const pass = document.getElementById('login-pass').value;
      fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ email: id, password: pass }) })
        .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.error); return data; })
        .then(session => {
          window.SehatState.hydrateGoogleSession(session);
          window.SehatUI.showToast('Login Successful', `Welcome back, ${session.user.name}! Redirecting to ${session.role.toUpperCase()} Dashboard...`, 'success');
          setTimeout(() => { window.location.href = `index.html#/${session.role}/dashboard`; }, 350);
        })
        .catch(error => window.SehatUI.showToast('Login Failed', error.message, 'warning'));
    });

    document.getElementById('otp-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = Array.from(document.querySelectorAll('.otp-box')).map(input => input.value).join('');
      const identifier = document.getElementById('otp-mobile-input').value.trim();
      fetch('/api/auth/otp/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ identifier, code }) })
        .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.error); return data; })
        .then(session => {
          window.SehatState.hydrateGoogleSession(session);
          window.SehatUI.showToast('OTP Verified', `Authentication successful. Launching ${session.role.toUpperCase()} dashboard...`, 'success');
          setTimeout(() => { window.location.href = `index.html#/${session.role}/dashboard`; }, 350);
        })
        .catch(error => window.SehatUI.showToast('Login Failed', error.message, 'warning'));
    });

    // Check URL parameters for authentication alerts
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const authErr = urlParams.get('authError');
      if (authErr === 'role_missing' || authErr === 'role_invalid') {
        window.SehatUI.showToast('Role Verification Failed', 'Your account role could not be verified. Please contact support.', 'warning');
      } else if (authErr === 'session_required') {
        window.SehatUI.showToast('Session Required', 'Please sign in to access your portal.', 'info');
      } else if (authErr) {
        window.SehatUI.showToast('Authentication Notice', decodeURIComponent(authErr), 'warning');
      }
    });
  </script>
</body>

</html>
